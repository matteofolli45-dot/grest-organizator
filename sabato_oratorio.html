<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a0b">
    <title>Grest Organizator - Sabato Oratorio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="sabor-theme">
    <div class="container">
        <h1>Sabato Oratorio <span class="current-year"></span></h1>

        <div class="top-right-menu">
            <button id="menuToggle" type="button" aria-expanded="false">Menu</button>
            <div class="top-right-dropdown" id="menuDropdown" aria-hidden="true">
                <a href="scelta_progetto.html" class="dropdown-item">Tipo attività</a>
            </div>
        </div>

        <!-- ===== INCONTRO DEL SABATO ===== -->
        <div class="card sabor-wrapper">
            <div class="sabor-header">
                <h3 class="sabor-title">Incontro del sabato</h3>
                <div class="sabor-day-picker">
                    <label for="saborDataInput" class="sabor-day-label">Data:</label>
                    <input type="date" id="saborDataInput" class="sabor-day-input">
                </div>
            </div>

            <div id="saborIncontroForm" class="sabor-incontro-form" style="display:none;">
                <p class="sabor-empty-msg">Nessun incontro registrato per questa data. Crealo per iniziare l'appello.</p>
                <div class="sabor-form-row">
                    <label for="saborTitoloInput">Attività</label>
                    <input type="text" id="saborTitoloInput" placeholder="Es. Torneo di calcetto">
                </div>
                <div class="sabor-form-row">
                    <label for="saborDescrizioneInput">Descrizione (opzionale)</label>
                    <textarea id="saborDescrizioneInput" rows="2"></textarea>
                </div>
                <div class="sabor-form-row">
                    <label for="saborTipoResponsabile">Responsabile</label>
                    <select id="saborTipoResponsabile">
                        <option value="animatore">Animatore</option>
                        <option value="catechista">Catechista</option>
                    </select>
                </div>
                <div class="sabor-form-row" id="saborResponsabileAnimatoreRow">
                    <label for="saborResponsabileAnimatoreSelect">Seleziona animatore</label>
                    <select id="saborResponsabileAnimatoreSelect"></select>
                </div>
                <div class="sabor-form-row" id="saborResponsabileNomeRow" style="display:none;">
                    <label for="saborResponsabileNomeInput">Nome catechista</label>
                    <input type="text" id="saborResponsabileNomeInput" placeholder="Nome e cognome">
                </div>
                <button type="button" class="button" id="saborCreaIncontroBtn">Crea incontro</button>
            </div>

            <div id="saborIncontroDettagli" class="sabor-incontro-dettagli" style="display:none;">
                <div class="sabor-incontro-info">
                    <p><strong id="saborIncontroTitolo"></strong></p>
                    <p id="saborIncontroDescrizione" class="sabor-incontro-desc"></p>
                    <p class="sabor-incontro-responsabile">Responsabile: <span id="saborIncontroResponsabile"></span></p>
                </div>
                <div class="sabor-counter">
                    Presenti oggi: <strong id="saborContatorePresenti">0</strong> / <span id="saborContatoreTotale">0</span>
                </div>
                <div class="table-wrapper">
                    <table class="sabor-table" id="saborPresenzeTable">
                        <thead>
                            <tr>
                                <th class="sabor-th-nome">Cognome e Nome</th>
                                <th class="sabor-th-check">Presente</th>
                            </tr>
                        </thead>
                        <tbody id="saborPresenzeBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ===== GESTIONE ISCRITTI ===== -->
        <div class="card sabor-wrapper">
            <div class="sabor-header">
                <h3 class="sabor-title">Iscritti Sabato Oratorio</h3>
            </div>

            <div class="sabor-add-box">
                <div class="sabor-add-tabs">
                    <button type="button" class="sabor-tab-btn active" data-tab="esistente">Da GREST</button>
                    <button type="button" class="sabor-tab-btn" data-tab="nuovo">Nuova iscrizione</button>
                </div>

                <div id="saborTabEsistente" class="sabor-tab-panel">
                    <select id="saborBambinoGrestSelect">
                        <option value="">Seleziona un bambino già registrato...</option>
                    </select>
                    <button type="button" class="button" id="saborAggiungiDaGrestBtn">Aggiungi</button>
                </div>

                <div id="saborTabNuovo" class="sabor-tab-panel" style="display:none;">
                    <input type="text" id="saborNuovoNome" placeholder="Nome">
                    <input type="text" id="saborNuovoCognome" placeholder="Cognome">
                    <button type="button" class="button" id="saborAggiungiNuovoBtn">Aggiungi</button>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="sabor-table" id="saborIscrittiTable">
                    <thead>
                        <tr>
                            <th class="sabor-th-nome">Cognome e Nome</th>
                            <th class="sabor-th-origine">Origine</th>
                            <th class="sabor-th-stato">Stato</th>
                            <th class="sabor-th-azioni">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="saborIscrittiBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
