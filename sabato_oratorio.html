<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a0b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Oratorio">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>Grest Organizator - Sabato Oratorio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="push-notifications.css">
</head>
<body class="sabor-theme">
    <div class="container sabor-page-container">
        <h1>Sabato Oratorio <span class="current-year"></span></h1>

        <div class="top-right-menu">
            <button id="menuToggle" type="button" aria-expanded="false">Menu</button>
            <div class="top-right-dropdown" id="menuDropdown" aria-hidden="true">
                <a href="scelta_progetto.html" class="dropdown-item">Tipo attività</a>
                <a href="avvisi_sabor.html" class="dropdown-item">Avvisi</a>
                <a href="admin_sabor.html" class="dropdown-item">Gestione sabato</a>
                <a href="impostazioni.html" class="dropdown-item">Impostazioni</a>
            </div>
        </div>

        <!-- ===== INCONTRO DEL SABATO ===== -->
        <div class="card sabor-wrapper">
            <div class="sabor-header">
                <h3 class="sabor-title">Incontro del sabato</h3>
                <div class="sabor-day-picker">
                    <label for="saborDataInput" class="sabor-day-label">Data:</label>
                    <input type="date" id="saborDataInput" class="sabor-day-input">
                </div>
            </div>

            <div id="saborNessunIncontro" class="sabor-empty-state" style="display:none;">
                <h3>Nessun incontro registrato per questa data.</h3>
            </div>

            <div id="saborIncontroDettagli" class="sabor-incontro-dettagli" style="display:none;">
                <div class="sabor-incontro-info">
                    <p><strong id="saborIncontroTitolo"></strong></p>
                    <p id="saborIncontroDescrizione" class="sabor-incontro-desc"></p>
                    <p class="sabor-incontro-responsabile">Responsabile: <span id="saborIncontroResponsabile"></span></p>
                </div>
                <section class="sabor-merenda-panel" aria-labelledby="saborMerendaTitle">
                    <h2 id="saborMerendaTitle">Bambini e merenda</h2>
                    <div class="sabor-total-box" aria-live="polite">
                        <span>Totale partecipanti alla merenda</span>
                        <strong id="saborTotaleBambini">0</strong>
                    </div>
                    <div class="sabor-merenda-view-box sabor-merenda-view-wide">
                        <span>Merenda prevista</span>
                        <ul id="saborMerendeView" class="sabor-merenda-list"></ul>
                    </div>
                </div>
            </div>
        </div>

        <section class="card weather-card sabor-weather-card" aria-labelledby="saborWeatherTitle">
            <div class="weather-header">
                <h2 id="saborWeatherTitle">Meteo del sabato</h2>
                <span class="weather-location">📍 Montevarchi</span>
            </div>
            <div class="weather-forecast sabor-weather-forecast" id="saborWeatherForecast" aria-live="polite">
                <p class="weather-forecast-message">Caricamento previsioni...</p>
            </div>
        </section>

    </div>

    <script src="app.js"></script>
    <script src="push-notifications.js"></script>
</body>
</html>
