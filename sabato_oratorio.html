<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Oratorio">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>Grest Organizator - Sabato Oratorio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="push-notifications.css">
</head>
<body class="sabor-theme">
    <div class="container sabor-page-container">
        <h1>Sabato Oratorio <span class="current-year"></span></h1>

        <div class="top-right-menu">
            <button id="menuToggle" type="button" aria-expanded="false">Menu</button>
            <div class="top-right-dropdown" id="menuDropdown" aria-hidden="true">
                <a href="scelta_progetto.html" class="dropdown-item">Tipo attività</a>
                <a href="avvisi_sabor.html" class="dropdown-item">Avvisi</a>
                <a href="admin_sabor.html" class="dropdown-item">Gestione sabato</a>
            </div>
        </div>

        <!-- ===== INCONTRO DEL SABATO ===== -->
        <div class="card sabor-wrapper">
            <div class="sabor-header">
                <h3 class="sabor-title">Incontro del sabato</h3>
                <div class="sabor-day-picker">
                    <label for="saborDataInput" class="sabor-day-label">Data:</label>
                    <input type="date" id="saborDataInput" class="sabor-day-input">
                </div>
            </div>

            <div id="saborNessunIncontro" class="sabor-empty-state" style="display:none;">
                <h3>Nessun incontro registrato per questa data.</h3>
            </div>

            <div id="saborIncontroDettagli" class="sabor-incontro-dettagli" style="display:none;">
                <div class="sabor-incontro-info">
                    <p><strong id="saborIncontroTitolo"></strong></p>
                    <p id="saborIncontroDescrizione" class="sabor-incontro-desc"></p>
                    <p class="sabor-incontro-responsabile">Responsabile: <span id="saborIncontroResponsabile"></span></p>
                </div>
                <section class="sabor-merenda-panel" aria-labelledby="saborMerendaTitle">
                    <h2 id="saborMerendaTitle">Bambini e merenda</h2>
                    <div class="sabor-total-box" aria-live="polite">
                        <span>Totale bambini</span>
                        <strong id="saborTotaleBambini">0</strong>
                    </div>
                    <fieldset class="sabor-class-accounts">
                        <legend>Conteggio per classe</legend>
                        <div class="sabor-count-grid">
                            <label class="sabor-form-row" for="saborBambiniClasse1">
                                <span>1ª elementare</span>
                                <input type="number" id="saborBambiniClasse1" data-sabor-field="bambini_classe_1" min="0" step="1" value="0">
                            </label>
                            <label class="sabor-form-row" for="saborBambiniClasse2">
                                <span>2ª elementare</span>
                                <input type="number" id="saborBambiniClasse2" data-sabor-field="bambini_classe_2" min="0" step="1" value="0">
                            </label>
                            <label class="sabor-form-row" for="saborBambiniClasse3">
                                <span>3ª elementare</span>
                                <input type="number" id="saborBambiniClasse3" data-sabor-field="bambini_classe_3" min="0" step="1" value="0">
                            </label>
                            <label class="sabor-form-row" for="saborBambiniClasse4">
                                <span>4ª elementare</span>
                                <input type="number" id="saborBambiniClasse4" data-sabor-field="bambini_classe_4" min="0" step="1" value="0">
                            </label>
                            <label class="sabor-form-row" for="saborBambiniClasse5">
                                <span>5ª elementare</span>
                                <input type="number" id="saborBambiniClasse5" data-sabor-field="bambini_classe_5" min="0" step="1" value="0">
                            </label>
                        </div>
                    </fieldset>
                    <div class="sabor-count-grid">
                        <label class="sabor-form-row" for="saborNumeroCeliaci">
                            <span>Bambini celiaci</span>
                            <input type="number" id="saborNumeroCeliaci" data-sabor-field="numero_celiaci" min="0" step="1" value="0">
                        </label>
                        <label class="sabor-form-row" for="saborNumeroIntolleranti">
                            <span>Bambini intolleranti</span>
                            <input type="number" id="saborNumeroIntolleranti" data-sabor-field="numero_intolleranti" min="0" step="1" value="0">
                        </label>
                    </div>
                    <label class="sabor-form-row" for="saborIntolleranze">
                        <span>Intolleranze: a cosa?</span>
                        <textarea id="saborIntolleranze" data-sabor-field="intolleranze" rows="2" placeholder="Es. lattosio, frutta a guscio"></textarea>
                    </label>
                    <label class="sabor-form-row" for="saborProblematicheMerenda">
                        <span>Altre problematiche per la merenda</span>
                        <textarea id="saborProblematicheMerenda" data-sabor-field="problematiche_merenda" rows="2"></textarea>
                    </label>
                    <fieldset class="sabor-snack-fieldset">
                        <legend>Merenda prevista</legend>
                        <div class="sabor-snack-options">
                            <label><input type="checkbox" name="saborMerenda" data-sabor-field="merende" value="Dolci"> Dolci</label>
                            <label><input type="checkbox" name="saborMerenda" data-sabor-field="merende" value="Pane e Nutella"> Pane e Nutella</label>
                            <label><input type="checkbox" name="saborMerenda" data-sabor-field="merende" value="Pane e marmellata"> Pane e marmellata</label>
                            <label><input type="checkbox" name="saborMerenda" data-sabor-field="merende" value="Pane e olio"> Pane e olio</label>
                            <label><input type="checkbox" name="saborMerenda" data-sabor-field="merende" value="Crackers"> Crackers</label>
                            <label><input type="checkbox" name="saborMerenda" data-sabor-field="merende" value="Succhi di frutta"> Succhi di frutta</label>
                            <label><input type="checkbox" name="saborMerenda" data-sabor-field="merende" value="Estathé"> Estathé</label>
                            <label><input type="checkbox" name="saborMerenda" data-sabor-field="merende" value="Biscotti vari"> Biscotti vari</label>
                        </div>
                    </fieldset>
                    <div class="sabor-save-row">
                        <span id="saborMerendaStato" role="status" aria-live="polite"></span>
                    </div>
                </div>
            </div>
        </div>

        <section class="card weather-card sabor-weather-card" aria-labelledby="saborWeatherTitle">
            <div class="weather-header">
                <h2 id="saborWeatherTitle">Meteo del sabato</h2>
                <span class="weather-location">📍 Montevarchi</span>
            </div>
            <div class="weather-forecast sabor-weather-forecast" id="saborWeatherForecast" aria-live="polite">
                <p class="weather-forecast-message">Caricamento previsioni...</p>
            </div>
        </section>

    </div>

    <script src="app.js"></script>
    <script src="push-notifications.js"></script>
</body>
</html>
