<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Grest">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>Grest Organizator - Impostazioni</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="push-notifications.css">
</head>
<body class="settings-page">
    <main class="container settings-container">
        <h1>Impostazioni</h1>
        <div class="top-right-menu">
            <button id="menuToggle" type="button" aria-expanded="false">Menu</button>
            <div class="top-right-dropdown" id="menuDropdown" aria-hidden="true">
                <a href="index.html" class="dropdown-item">Pagina principale/Attività</a>
                <a href="selezione_account.html" class="dropdown-item">Seleziona account</a>
                <a href="avvisi_grest.html" class="dropdown-item">Avvisi GREST</a>
                <a href="sabato_oratorio.html" class="dropdown-item">Sabato Oratorio</a>
            </div>
        </div>

        <section class="card settings-notifications-card" aria-labelledby="pushPreferencesTitle">
            <h2 id="pushPreferencesTitle">Notifiche</h2>
            <p class="settings-intro">Scegli quali aggiornamenti vuoi ricevere su questo dispositivo.</p>
            <p class="settings-intro" id="pushAnimatorStatus"></p>
            <div class="settings-push-status" id="pushPreferencesStatus" role="status" aria-live="polite">
                Caricamento impostazioni...
            </div>
            <button type="button" id="pushSettingsToggle" class="settings-save-button" disabled>
                Caricamento...
            </button>
            <div class="push-preferences-groups" id="pushPreferences">
                <fieldset class="push-preferences-list" disabled>
                    <legend>GREST</legend>
                    <label class="push-preference-option">
                        <input type="checkbox" data-push-category="grestManager" checked>
                        <span>Gestore del gioco</span>
                    </label>
                    <label class="push-preference-option">
                        <input type="checkbox" data-push-category="grestActivities" checked>
                        <span>Attività</span>
                    </label>
                    <label class="push-preference-option">
                        <input type="checkbox" data-push-category="grestNotices" checked>
                        <span>Avvisi</span>
                    </label>
                    <label class="push-preference-option">
                        <input type="checkbox" data-push-category="grestLunchCount" checked>
                        <span>Totale persone a mensa <small>(Alle 9:15)</small></span>
                    </label>
                </fieldset>
                <fieldset class="push-preferences-list" disabled>
                    <legend>Sabato Oratorio</legend>
                    <label class="push-preference-option">
                        <input type="checkbox" data-push-category="saborActivities" checked>
                        <span>Attività e incontri</span>
                    </label>
                    <label class="push-preference-option">
                        <input type="checkbox" data-push-category="saborNotices" checked>
                        <span>Avvisi</span>
                    </label>
                </fieldset>
            </div>
            <button type="button" id="savePushPreferences" class="settings-save-button" disabled>
                Salva preferenze
            </button>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script src="push-notifications.js"></script>
</body>
</html>
