<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="style.css">
<title>METRO RUSH</title>
    <script src="app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
 
* { box-sizing: border-box; }
 
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 0%, #232342, #0b0b16 70%);
  font-family: 'Press Start 2P', 'Courier New', monospace;
  padding: 16px;
  overflow: hidden;
}
 
.game-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
 
.game-frame {
  position: relative;
  width: min(88vw, 340px, 48.5vh);
  aspect-ratio: 160 / 280;
  box-shadow: 0 0 0 4px #0b0b16, 0 0 0 6px #f4d35e, 0 20px 50px rgba(0,0,0,0.6);
  border-radius: 4px;
  overflow: hidden;
  background: #1a1b2e;
}
 
#game {
  width: 100%; height: 100%; display: block;
  image-rendering: pixelated; image-rendering: crisp-edges;
  touch-action: none;
}
 
#hud {
  position: absolute; top: 6px; left: 0; right: 0;
  display: flex; justify-content: space-between; padding: 0 8px;
  font-size: 8px; color: #f4f1de; text-shadow: 1px 1px 0 #000;
  pointer-events: none; letter-spacing: 0.5px;
}
#hud-ability { color: #f4d35e; }
 
.overlay {
  position: absolute; inset: 0;
  background: rgba(13,13,22,0.94);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 16px; color: #f4f1de;
  overflow-y: auto;
}
.overlay.hidden { display: none; }
.overlay.compact { justify-content: flex-start; padding-top: 20px; }
 
.title { font-size: 16px; color: #f4d35e; text-shadow: 2px 2px 0 #e63946; line-height: 1.7; }
.title.small { font-size: 12px; }
 
.controls-hint { font-size: 6.5px; line-height: 2; color: #9b9bb0; }
 
.stat { font-size: 9px; }
.stat span { color: #ffd700; }
 
.pixel-btn {
  font-family: inherit; font-size: 9px; padding: 10px 18px;
  background: #4ecdc4; color: #0d0d16; border: none;
  box-shadow: 3px 3px 0 #22223b; cursor: pointer; letter-spacing: 1px;
}
.pixel-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #22223b; }
.pixel-btn.secondary { background: #c9c9d9; }
 
.gameover-btns, .editor-actions { display: flex; gap: 10px; }
 
.footer-hint { font-size: 7px; color: #6b6b80; text-align: center; letter-spacing: 0.5px; }
 
/* --- character select --- */
.char-select { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 100%; }
.char-nav { display: flex; align-items: center; justify-content: center; gap: 10px; }
.nav-btn {
  font-family: inherit; font-size: 13px; background: #22223b; color: #f4d35e;
  border: 2px solid #f4d35e; width: 26px; height: 26px; cursor: pointer;
  line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0;
}
.nav-btn:active { transform: translate(1px,1px); }
.char-name { font-size: 9px; color: #f4d35e; min-width: 110px; }
.ability-name { font-size: 7.5px; color: #4ecdc4; letter-spacing: 0.5px; }
.ability-desc { font-size: 6.5px; line-height: 1.7; color: #c9c9d9; max-width: 230px; }
 
#char-icon {
  width: min(140px, 40vh, 40vw);
  height: auto;
  image-rendering: pixelated;
  border: 2px solid #3d3d5c;
  background: #14141f;
}
 
.reset-link {
  font-size: 6px; color: #6b6b80; background: none; border: none;
  text-decoration: underline; cursor: pointer; font-family: inherit; padding: 2px;
}
 
/* --- icon editor --- */
#editor-canvas {
  width: min(72vw, 224px);
  height: auto;
  image-rendering: pixelated;
  border: 2px solid #3d3d5c;
  touch-action: none;
  background: #14141f;
}
.tool-row { display: flex; gap: 8px; }
.tool-btn {
  font-family: inherit; font-size: 7px; padding: 6px 10px;
  background: #22223b; color: #c9c9d9; border: 2px solid #3d3d5c; cursor: pointer;
}
.tool-btn.selected { border-color: #f4d35e; color: #f4d35e; }
 
.swatch-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 230px; }
.swatch { width: 16px; height: 16px; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatch.selected { border-color: #f4f1de; }
 
.color-picker-row { display: flex; align-items: center; gap: 6px; font-size: 6.5px; color: #9b9bb0; }
#editor-custom-color { width: 28px; height: 20px; border: none; padding: 0; background: none; cursor: pointer; }
</style>
</head>
<body>
        <div class="top-right-menu">
            <button id="menuToggle" type="button" aria-expanded="false">Menu</button>
            <div class="top-right-dropdown" id="menuDropdown" aria-hidden="true">
                <a href="index_grest.html" class="dropdown-item">Pagina principale/Attività</a>
                <a href="animatori_grest.html" class="dropdown-item">Animatori squadre</a>
                <a href="avvisi_grest.html" class="dropdown-item">Avvisi</a>
                <a href="admin_grest.html" class="dropdown-item">Admin</a>
            </div>
        </div>

 
<div class="game-wrap">
  <div class="game-frame">
    <canvas id="game" width="160" height="280"></canvas>
 
    <div id="hud">
      <span id="hud-score">0</span>
      <span id="hud-ability"></span>
      <span id="hud-best">MIGLIOR 0</span>
    </div>
 
    <div id="select-overlay" class="overlay compact">
      <div class="title small">METRO RUSH</div>
 
      <div class="char-select">
        <div class="char-nav">
          <button id="prev-char" class="nav-btn" type="button">‹</button>
          <div class="char-name" id="char-name">—</div>
          <button id="next-char" class="nav-btn" type="button">›</button>
        </div>
 
        <div class="ability-name" id="char-ability-name">—</div>
 
        <canvas id="char-icon" width="140" height="180"></canvas>
 
        <div class="ability-desc" id="char-ability-desc">—</div>
 
        <button id="edit-icon-btn" class="reset-link" type="button">✎ personalizza icona</button>
      </div>
 
      <div class="controls-hint">← → CAMBIA CORSIA &nbsp; ↑ SALTA &nbsp; ↓ SCIVOLA</div>
      <button id="start-btn" class="pixel-btn">GIOCA</button>
    </div>
 
    <div id="gameover-overlay" class="overlay hidden">
      <div class="title small">FINE CORSA</div>
      <div class="stat">PUNTI <span id="final-score">0</span></div>
      <div class="stat">MIGLIOR <span id="final-best">0</span></div>
      <div class="gameover-btns">
        <button id="restart-btn" class="pixel-btn">RIPROVA</button>
        <button id="change-char-btn" class="pixel-btn secondary">PERSONAGGI</button>
      </div>
    </div>
 
    <div id="icon-editor-overlay" class="overlay compact hidden">
      <div class="title small">ICONA — <span id="editor-char-name"></span></div>
 
      <canvas id="editor-canvas" width="224" height="288"></canvas>
 
      <div class="tool-row">
        <button id="tool-pencil" class="tool-btn selected" type="button">MATITA</button>
        <button id="tool-eraser" class="tool-btn" type="button">GOMMA</button>
      </div>
 
      <div class="swatch-row" id="editor-palette"></div>
 
      <div class="color-picker-row">
        <span>PERSONALIZZATO</span>
        <input type="color" id="editor-custom-color" value="#4ecdc4">
      </div>
 
      <div class="editor-actions">
        <button id="editor-reset-btn" class="reset-link" type="button">predefinita</button>
        <button id="editor-clear-btn" class="reset-link" type="button">svuota tutto</button>
      </div>
 
      <div class="gameover-btns">
        <button id="editor-save-btn" class="pixel-btn">SALVA</button>
        <button id="editor-cancel-btn" class="pixel-btn secondary">ANNULLA</button>
      </div>
    </div>
  </div>
  <div class="footer-hint">scegli il tuo corridore e disegna la sua icona</div>
</div>
</body>
</html>
