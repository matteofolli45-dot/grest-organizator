<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Grest">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>Grest Organizator - Avvisi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="push-notifications.css">
</head>
<body>
    <div class="container">
        <h1>Avvisi GREST <span class="current-year"></span></h1>

        <div class="top-right-menu">
            <button id="menuToggle" type="button" aria-expanded="false">Menu</button>
            <div class="top-right-dropdown" id="menuDropdown" aria-hidden="true">
                <a href="index.html" class="dropdown-item">Pagina principale/Attività</a>
                <a href="appello.html" class="dropdown-item">Appello</a>
                <a href="animatori_grest.html" class="dropdown-item">Animatori squadre</a>
                <a href="grest-rush.html" class="dropdown-item">Grest Rush</a>
                <a href="admin_grest.html" class="dropdown-item">Admin</a>
                <a href="impostazioni.html" class="dropdown-item">Impostazioni</a>
            </div>
        </div>

        <div class="avvisi-grid">
        
        <!-- COLONNA SINISTRA -->
        <div class="avvisi-col-left">
            <div class="card avvisi-card avvisi-today-card">
                <h3>Avvisi Odierni</h3>
                <div id="avvisiOdierniContent">
                    <p class="avvisi-empty">Nessun avviso per oggi.</p>
                </div>
            </div>

            <div class="card avvisi-card avvisi-form-card">
                <h3>Nuovo Avviso</h3>
                <div class="avviso-author-line">
                    Pubblichi come: <strong id="autoreDisplay" class="avviso-autore">Caricamento...</strong>
                </div>
                <textarea id="avvisoInput" class="avviso-input" placeholder="Scrivi il tuo avviso qui..."></textarea>
                <button id="refreshButton" class="avviso-submit" type="button" ">Invia Avviso</button>
            </div>
        </div>

        <!-- COLONNA DESTRA -->
        <div class="avvisi-col-right">
            <div class="card avvisi-card avvisi-history-card">
                <h3>Storico Avvisi</h3>
                <div id="avvisiStoricoContent" class="avvisi-history-content">
                    <p class="avvisi-empty">Nessun avviso nel registro.</p>
                </div>
            </div>
        </div>

        </div> <!-- Fine .avvisi-grid -->
    </div>

    <script src="app.js"></script>
    <script src="push-notifications.js"></script>
</body>
</html>
