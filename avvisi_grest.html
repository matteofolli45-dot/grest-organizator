<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grest Organizator - Avvisi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Layout Grid Affiancato (Come da bozza) */
        .avvisi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .avvisi-grid {
                grid-template-columns: 1fr; /* Responsivo su mobile */
            }
        }

        .avviso-item {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--accent, #4ecdc4);
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .avviso-data {
            font-size: 0.75em;
            color: #888;
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Avvisi GREST <span class="current-year"></span></h1>

        <div class="top-right-menu">
            <button id="menuToggle" type="button" aria-expanded="false">Menu</button>
            <div class="top-right-dropdown" id="menuDropdown" aria-hidden="true">
                <a href="index.html" class="dropdown-item">Pagina principale/Attività</a>
                <a href="appello.html" class="dropdown-item">Appello</a>
                <a href="animatori_grest.html" class="dropdown-item">Animatori squadre</a>
                <a href="grest-rush.html" class="dropdown-item">Grest Rush</a>
                <a href="admin_grest.html" class="dropdown-item">Admin</a>
            </div>
        </div>

        <div class="avvisi-grid">
        
        <!-- COLONNA SINISTRA -->
        <div class="avvisi-col-left">
            <div class="card" style="margin-bottom: 20px;">
                <h3>Avvisi Odierni</h3>
                <div id="avvisiOdierniContent">
                    <p style="color: #999;">Nessun avviso per oggi.</p>
                </div>
            </div>

            <div class="card">
                <h4>Nuovo Avviso</h4>
                <div style="margin-bottom: 12px; font-size: 0.9em; color: #555;">
                    Pubblichi come: <strong id="autoreDisplay" style="color: var(--accent, #4ecdc4);">Caricamento...</strong>
                </div>
                <textarea id="avvisoInput" placeholder="Scrivi il tuo avviso qui..." style="width: 100%; height: 75px; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit; resize: none;"></textarea>
                <button id="refreshButton" type="button" style="background: var(--accent, #4ecdc4); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">Invia Avviso</button>
            </div>
        </div>

        <!-- COLONNA DESTRA -->
        <div class="avvisi-col-right">
            <div class="card" style="height: 100%;">
                <h3>Storico Avvisi</h3>
                <div id="avvisiStoricoContent" style="max-height: 500px; overflow-y: auto; margin-top: 10px;">
                    <p style="color: #999;">Nessun avviso nel registro.</p>
                </div>
            </div>
        </div>

        </div> <!-- Fine .avvisi-grid -->
    </div>

    <script src="app.js"></script>
</body>
</html>
